<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appointments</title>

<link rel="stylesheet" href="../assets/style/appointment.css">
<link rel="stylesheet" href="../assets/style/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <a href="admin.html">
            <i class="fa-solid fa-house"></i>
        </a>

        <a href="patients.html">
            <i class="fa-solid fa-users"></i>
        </a>

        <a href="doctors.html">
            <i class="fa-solid fa-user-doctor"></i>
        </a>

        <a href="appointments.html" class="active">
            <i class="fa-solid fa-calendar"></i>
        </a>

        <a href="reports.html">
            <i class="fa-solid fa-chart-column"></i>
        </a>

    </aside>

    <main class="main">

        <div class="page-header">

            <h1>Appointments</h1>

            <input
            type="text"
            id="searchAppointment"
            placeholder="Search...">

        </div>

        <!-- Form -->

        <div class="form-card">

            <h3>Create Appointment</h3>

            <form id="appointmentForm">

                <select id="patientSelect" required></select>

                <select id="doctorSelect" required></select>

                <input
                type="date"
                id="appointmentDate"
                required>

                <select id="appointmentStatus">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

                <button type="submit">
                    Save Appointment
                </button>

            </form>

        </div>

        <!-- Table -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="appointmentTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="../dashboardJS/appointments.js"></script>

</body>
</html>
