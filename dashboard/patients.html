<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patients Management</title>

<link rel="stylesheet" href="../assets/style/dashboard.css">
<link rel="stylesheet" href="../assets/style/patient.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <a href="admin.html">
            <i class="fa-solid fa-house"></i>
        </a>

        <a href="patients.html" class="active">
            <i class="fa-solid fa-users"></i>
        </a>

        <a href="doctors.html">
            <i class="fa-solid fa-user-doctor"></i>
        </a>

        <a href="appointments.html">
            <i class="fa-solid fa-calendar"></i>
        </a>

        <a href="reports.html">
            <i class="fa-solid fa-chart-column"></i>
        </a>

    </aside>

    <main class="main">

        <div class="page-header">

            <h1>Patients Management</h1>

            <input
                type="text"
                id="searchPatient"
                placeholder="Search patient...">

        </div>

        <!-- Form -->

        <div class="form-card">

            <h3>Add Patient</h3>

            <form id="patientForm">

                <input
                    type="text"
                    id="patientName"
                    placeholder="Patient Name"
                    required>

                <input
                    type="number"
                    id="patientAge"
                    placeholder="Age"
                    required>

                <select id="patientGender">

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                </select>

                <input
                    type="text"
                    id="patientPhone"
                    placeholder="Phone Number"
                    required>

                <button type="submit">
                    Save Patient
                </button>

            </form>

        </div>

        <!-- Table -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="patientTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="../dashboardJS/patients.js"></script>

</body>
</html>
