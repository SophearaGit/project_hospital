<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Doctors</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/style/aside.css" />
    <link rel="stylesheet" href="./assets/style/add_doctors_admin.css" />
    <link rel="stylesheet" href="./assets/style/main_admin.css" />
  </head>
  <body>
    <div class="container">
      <!-- ================= SIDEBAR ================= -->
      <aside class="aside">
        <div class="title-head">
          <i class="fa-solid fa-heart-pulse"></i>
          <div class="title">
            <span>CarePlus</span>
            <span>Doctor Pannel</span>
          </div>
        </div>

        <div class="aside-head">
          <div class="upper-head">
            <a href="main_admin.html">
              <i class="fa-solid fa-house"></i>
              Dashboard
            </a>

            <div class="dropdown">
              <button class="dropbtn">
                <i class="fa-solid fa-users"></i>
                Users
                <i class="fa-solid fa-chevron-down"></i>
              </button>

              <div class="dropdown-content">
                <a href="patients_admin.html">
                  <i class="fa-solid fa-user"></i>
                  Patients
                </a>

                <a href="department_admin.html">
                  <i class="fa-solid fa-building-user"></i>
                  Departments
                </a>

                <a href="doctors_admin.html">
                  <i class="fa-solid fa-user-doctor"></i>
                  Doctors
                </a>

                <a href="appointments_admin.html">
                  <i class="fa-solid fa-calendar-check"></i>
                  Appointments
                </a>
              </div>
            </div>

            <a href="reports_admin.html">
              <i class="fa-solid fa-chart-column"></i>
              Reports
            </a>

            <a href="settings.html">
              <i class="fa-solid fa-gear"></i>
              Settings
            </a>
          </div>

          <div class="under-head">
            <a href="http://">
              <i class="fa-regular fa-circle-question"></i>
              Support
            </a>
            <a href="login.html">
              <i class="fa-solid fa-right-from-bracket"></i>
              Log Out
            </a>
          </div>
        </div>
      </aside>

      <!-- ================= MAIN ================= -->
      <main class="main main_add">
        <!-- HEADER -->
        <div class="header">
          <!-- Left -->
          <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
          </button>

          <!-- Center -->
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search patients, records..." />
          </div>

          <!-- Right -->
          <div class="right-header">
            <!-- Dark Mode -->
            <div class="mode-icon">
              <i id="theme-toggle" class="fa-regular fa-moon"></i>
            </div>

            <!-- Notification -->
            <div class="notification">
              <i class="fa-solid fa-bell"></i>
              <span class="dot"></span>
            </div>

            <!-- Profile -->
            <div class="profile">
              <img src="https://i.pravatar.cc/100" alt="" />
              <div class="info-name">
                <h4 id="profileName">Administrator</h4>
              </div>
            </div>
          </div>
        </div>
        <!-- Back to doctor -->
        <!-- <div class="back">
          <a href="./doctors_admin.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to doctors
          </a>
        </div> -->
        <!-- ================= FORM CARD ================= -->
        <section class="doctor-form-card">
          <div class="card-title">
            <div class="title-icon">
              <i class="fa-solid fa-user-doctor"></i>
            </div>

            <h2>Doctor Information</h2>
          </div>

          <form>
            <div class="form-grid">
              <!-- Full Name -->
              <div class="form-group">
                <label> Full Name <span>*</span> </label>

                <input type="text" placeholder="Enter doctor full name" />
              </div>

              <!-- Department -->
              <div class="form-group">
                <label> Department <span>*</span> </label>

                <select>
                  <option value="">Select department</option>
                  <option>Cardiology</option>
                  <option>Orthopedics</option>
                  <option>Oncology</option>
                  <option>Dermatology</option>
                  <option>Surgery</option>
                  <option>Gynecology</option>
                </select>
              </div>

              <!-- Specialization -->
              <div class="form-group">
                <label> Specialization <span>*</span> </label>

                <input type="text" placeholder="Enter specialization" />
              </div>

              <!-- Email -->
              <div class="form-group">
                <label> Email <span>*</span> </label>

                <input type="email" placeholder="Enter email address" />
              </div>

              <!-- Phone -->
              <div class="form-group">
                <label> Phone Number <span>*</span> </label>

                <input type="tel" placeholder="Enter phone number" />
              </div>

              <!-- Gender -->
              <div class="form-group">
                <label> Gender <span>*</span> </label>

                <select>
                  <option value="">Select gender</option>
                  <option>Male</option>
                  <option>Female</option>
                </select>
              </div>

              <!-- Date -->
              <div class="form-group">
                <label> Date of Birth <span>*</span> </label>

                <input type="date" />
              </div>

              <!-- Experience -->
              <div class="form-group">
                <label> Experience (Years) <span>*</span> </label>

                <input type="number" placeholder="Enter years of experience" />
              </div>

              <!-- Consultation -->
              <div class="form-group">
                <label> Consultation Fee ($) <span>*</span> </label>

                <input type="number" placeholder="Enter consultation fee" />
              </div>

              <!-- Qualification -->
              <div class="form-group">
                <label>Qualification</label>

                <input type="text" placeholder="Enter qualification" />
              </div>

              <!-- Availability -->
              <div class="form-group">
                <label> Availability <span>*</span> </label>

                <select>
                  <option value="">Select availability</option>
                  <option>Available</option>
                  <option>Unavailable</option>
                </select>
              </div>

              <!-- Photo Upload -->
              <!-- <div class="form-group photo-group">
                <label>Doctor Photo</label>

                <label class="upload-box">
                  <input type="file" accept="image/*" />

                  <div class="upload-icon">
                    <i class="fa-solid fa-camera"></i>
                  </div>

                  <h4>Upload Doctor Photo</h4>

                  <p>PNG, JPG up to 2MB</p>
                </label>
              </div> -->
              <!-- Photo Upload -->
              <div class="form-group photo-group">
                <label>Doctor Photo</label>

                <label class="upload-box">
                  <!-- បន្ថែម id="photoInput" ដើមី្បងាយស្រួល Select -->
                  <input type="file" id="photoInput" accept="image/*" />

                  <!-- Element ដើមរបស់អ្នក -->
                  <div class="upload-icon">
                    <i class="fa-solid fa-camera"></i>
                  </div>
                  <h4>Upload Doctor Photo</h4>
                  <p>PNG, JPG up to 2MB</p>

                  <img
                    id="imagePreview"
                    src=""
                    alt="Preview"
                    style="
                      display: none;
                      max-width: 100%;
                      max-height: 150px;
                      border-radius: 8px;
                      margin-top: 10px;
                      object-fit: cover;
                    "
                  />
                </label>
              </div>

              <!-- Address -->
              <div class="form-group">
                <label>Address</label>

                <textarea placeholder="Enter address"></textarea>
              </div>

              <!-- Bio -->
              <div class="form-group">
                <label>Bio</label>

                <textarea
                  placeholder="Enter short bio about the doctor"
                ></textarea>
              </div>

              <!-- Status -->
              <div class="status-group">
                <label> Status <span>*</span> </label>

                <div class="radio-container">
                  <label class="radio">
                    <input type="radio" name="status" checked />
                    <span>Active</span>
                  </label>

                  <label class="radio">
                    <input type="radio" name="status" />
                    <span>Inactive</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- FORM BUTTONS -->
            <div class="form-buttons">
              <a href="./doctors_admin.html">
                <button type="button" class="cancel-btn">Cancel</button>
              </a>

              <button type="submit" class="save-btn">
                <i class="fa-regular fa-floppy-disk"></i>
                Save Doctor
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="./assets/script/add_doctor_admin.js"></script>
    <script src="../assets/script/script.js" type="module"></script>
    <script src="../assets/script/menu_dashboard.js"></script>
    <script src="./assets/script/dropdown_dashboard.js"></script>
  </body>
</html>
