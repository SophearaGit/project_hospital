          </div>
        </div>

      <main class="main">
        <!-- header  -->
        <div class="header">
          <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
          </button>

          <!-- center -->
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search patients, records..." />
          </div>

          <!-- right -->
          <div class="head-right">
            <!-- <i class="fa-solid fa-magnifying-glass"></i> -->
            <!-- Dark Mode -->
            <div class="mode-icon">
              <i id="theme-toggle" class="fa-regular fa-moon"></i>
            </div>

            <!-- Notification -->
            <div class="notification">
              <i class="fa-solid fa-bell"></i>
              <span class="dot"></span>
            </div>

            <div class="avata">
              <img src="https://i.pravatar.cc/100" />
              <!-- <h5>Dr. Sarah Johnson</h5> -->
            </div>
          </div>
        </div>

        <div class="add-patient-page">
          <div class="page-header">
            <h2>Add New Patient</h2>
            <p>Enter patient information below.</p>
          </div>

          <form id="patientForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Patient Name</label>
                <input type="text" id="patientName" placeholder="Full Name" />
              </div>

              <div class="form-group">
                <label>Age</label>
                <input type="number" id="patientAge" placeholder="Age" />
              </div>

              <div class="form-group">
                <label>Gender</label>
                <select id="patientGender">
                  <option>Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                </select>
              </div>

              <div class="form-group">
                <label>Phone Number</label>
                <input
                  type="text"
                  id="patientPhone"
                  placeholder="Phone Number"
                />
              </div>

              <div class="form-group">
                <label>Blood Group</label>
                <select id="patientBlood">
                  <option>Select Blood</option>
                  <option>A+</option>
                  <option>A-</option>
                  <option>B+</option>
                  <option>B-</option>
                  <option>AB+</option>
                  <option>AB-</option>
                  <option>O+</option>
                  <option>O-</option>
                </select>
              </div>

              <div class="form-group">
                <label>Last Visit</label>
                <input type="date" id="lastVisit" />
              </div>

              <div class="form-group">
                <label>Status</label>
                <select id="patientStatus">
                  <option>Status</option>
                  <option>Padding</option>
                  <option>Comfirmed</option>
                  <option>Cencalled</option>
                </select>
              </div>
            </div>

            <div class="button-group">
              <button type="submit" class="save-btn">Save Patient</button>
              <button type="reset" class="cancel-btn">Cancel</button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="../assets/script/patient_doctor.js"></script>
    <script src="../assets/script/script.js" type="module"></script>
  </body>
