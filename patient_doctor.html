<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/style/aside.css" />
    <link rel="stylesheet" href="../assets/style/main_doctor.css" />
    <link rel="stylesheet" href="../assets/style/patient_doctor.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <div class="container">
      <!-- aside -->
      <aside class="aside">
        <div class="title-head">
          <i class="fa-solid fa-heart-pulse"></i>
          <div class="title">
            <span>CarePlus</span>
            <span>Doctor Pannel</span>
          </div>
        </div>

        <div class="aside-head">
          <div class="upper-head">
            <a href="main_doctor.html">
              <i class="fa-solid fa-house"></i>
              Dashboard
            </a>

            <a href="appointments_doctor.html">
              <i class="fa-solid fa-calendar"></i>
              Appointments
            </a>

            <a href="patient_doctor.html">
              <i class="fa-solid fa-users"></i>
              Patients
            </a>

            <a href="schedule_doctor.html">
              <i class="fa-regular fa-calendar"></i>
              Schedules
            </a>

            <a href="prescription_doctor.html">
              <i class="fa-solid fa-file-prescription"></i>
              Prescriptions
            </a>

            <a href="history_doctor.html">
              <i class="fa-solid fa-file-medical"></i>
              History
            </a>

            <!-- <div class="dropdown">
              <button class="dropbtn">
                <i class="fa-solid fa-users"></i>
                Users
                <i class="fa-solid fa-chevron-down"></i>
              </button>

              <div class="dropdown-content">
                <a href="patients_admin.html">
                  <i class="fa-solid fa-user"></i>
                  Patients
                </a>

                <a href="doctors_admin.html">
                  <i class="fa-solid fa-user-doctor"></i>
                  Doctors
                </a>

                <a href="appointments_admin.html">
                  <i class="fa-solid fa-calendar-check"></i>
                  Appointments
                </a>
              </div>
            </div> -->

            <!-- <a href="reports_admin.html">
              <i class="fa-solid fa-chart-column"></i>
              Reports
            </a> -->

            <a href="settings.html">
              <i class="fa-solid fa-gear"></i>
              Settings
            </a>
          </div>

          <div class="under-head">
            <a href="http://">
              <i class="fa-regular fa-circle-question"></i>
              Support
            </a>
            <a href="login.html">
              <i class="fa-solid fa-right-from-bracket"></i>
              Log Out
            </a>
          </div>
        </div>
      </aside>

      <main class="main">
        <!-- Header -->
        <div class="header">
          <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
          </button>

          <!-- center -->
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search patients, records..." />
          </div>

          <!-- right -->
          <div class="head-right">
            <!-- <i class="fa-solid fa-magnifying-glass"></i> -->
            <!-- Dark Mode -->
            <div class="mode-icon">
              <i id="theme-toggle" class="fa-regular fa-moon"></i>
            </div>

            <!-- Notification -->
            <div class="notification">
              <i class="fa-solid fa-bell"></i>
              <span class="dot"></span>
            </div>

            <div class="avata">
              <img src="https://i.pravatar.cc/100" />
              <!-- <h5>Dr. Sarah Johnson</h5> -->
            </div>
          </div>
        </div>

        <!-- Appointment Content -->
        <div class="page-content">
          <div class="page-title">
            <div>
              <h2>Patients</h2>
              <p>View and manage all appointments.</p>
            </div>

            <a href="../add_patient_doctor.html">
              <button class="add-btn">
                <i class="fa-solid fa-plus"></i>
                New Patient
              </button>
            </a>
          </div>

          <div class="filter-bar">
            <div class="filter-patient">
              <i class="fa-solid fa-magnifying-glass"></i>
              <span>seacrh patients...</span>
            </div>

            <select>
              <option>All Status</option>
              <option>Confirmed</option>
              <option>Pending</option>
              <option>Cancelled</option>
            </select>
          </div>

          <div class="table-card">
            <table id="patientsTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Patient</th>
                  <th>Age</th>
                  <th>Gender</th>
                  <th>Phone</th>
                  <th>Blood</th>
                  <th>Last Visit</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="doctorpatientTable">
                <tr id="patientRowTemplate">
                  <td class="patient-id"></td>
                  <td class="patient">
                    <!-- <img class="patient-img" src="https://i.pravatar.cc/40?img=1"> -->
                    <span class="patient-name"></span>
                  </td>
                  <td class="patient-age"></td>
                  <td class="patient-gender"></td>
                  <td class="patient-phone"></td>
                  <td class="patient-blood"></td>
                  <td class="patient-last-visit"></td>
                  <td class="patient-status"></td>
                  <td class="action">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="../assets/script/patient_doctor.js"></script>
    <script src="../assets/script/main_doctordash.js"></script>
    <script src="../assets/script/script.js" type="module"></script>
  </body>
</html>
